[package]
name = "messaging-platform-application"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "messaging_platform_application_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# reqwest
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# AWS SDK (Cognito auth only)
aws-config = "1.5"
aws-sdk-cognitoidentityprovider = "1.60"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dotenvy = "0.15"

# Local encrypted message storage (SQLCipher + vendored OpenSSL for cross-compilation)
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

# Vault (DEK/KEK key management)
argon2 = { version = "0.5", features = ["zeroize"] }
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
hex = "0.4"

# Image processing (thumbnails)
image = "0.25"
urlencoding = "2"

# MLS (E2E Encryption)
openmls = { version = "0.6", features = ["test-utils"] }
openmls_rust_crypto = "0.3"
openmls_memory_storage = { version = "0.3", features = ["persistence"] }
openmls_basic_credential = "0.3"
openmls_traits = "0.3"
uuid = { version = "1", features = ["v4"] }
