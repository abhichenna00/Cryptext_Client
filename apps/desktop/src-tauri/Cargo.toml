[package]
name = "messaging-platform-application"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "messaging_platform_application_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# reqwest
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# AWS SDK (Cognito auth only)
aws-config = "1.5"
aws-sdk-cognitoidentityprovider = "1.60"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dotenvy = "0.15"

# MLS (E2E Encryption)
openmls = { version = "0.6", features = ["test-utils"] }
openmls_rust_crypto = "0.3"
openmls_basic_credential = "0.3"
openmls_traits = "0.3"
uuid = { version = "1", features = ["v4"] }
