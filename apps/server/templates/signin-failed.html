<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign-in failed · NShroud</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #141418;
      --border: #26262d;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --amber: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1100px 560px at 50% -12%, rgba(239, 68, 68, 0.14), transparent 60%),
        radial-gradient(900px 500px at 50% 0%, rgba(245, 158, 11, 0.06), transparent 55%),
        var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 48px 36px 40px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to   { opacity: 1; transform: none; }
    }
    .mark { width: 76px; height: 76px; margin: 0 auto 26px; display: block; opacity: 0.92; }
    h1 {
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      line-height: 1.2;
    }
    .accent {
      background: linear-gradient(120deg, var(--red), #b91c1c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .hint {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 15px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
    }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body>
  <main class="card" role="alert">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="NShroud">
      <defs>
        <linearGradient id="ns-grad" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f59e0b"></stop>
          <stop offset="1" stop-color="#ef4444"></stop>
        </linearGradient>
        <pattern id="ns-hatch" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
          <line x1="0" y1="0" x2="0" y2="2.6" stroke="#fff" stroke-width="1.6"></line>
        </pattern>
        <mask id="ns-nmask">
          <rect x="4" y="4" width="56" height="56" fill="#fff"></rect>
          <path d="M16.5 15.5 H25.3 L39.5 36.3 V15.5 H47.5 V48.5 H38.7 L24.5 27.7 V48.5 H16.5 Z" fill="#000"></path>
        </mask>
        <mask id="ns-ink">
          <rect x="4" y="4" width="56" height="56" fill="none" stroke="#fff" stroke-width="3"></rect>
          <rect x="4" y="4" width="56" height="56" fill="url(#ns-hatch)" mask="url(#ns-nmask)"></rect>
          <path d="M16.5 15.5 H25.3 L39.5 36.3 V15.5 H47.5 V48.5 H38.7 L24.5 27.7 V48.5 H16.5 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"></path>
        </mask>
      </defs>
      <rect x="0" y="0" width="64" height="64" fill="url(#ns-grad)" mask="url(#ns-ink)"></rect>
    </svg>
    <h1>Sign-in <span class="accent">failed</span></h1>
    <p>Your {{provider}} sign-in didn't complete. Please close this tab and try again from NShroud.</p>
    <div class="hint"><span class="dot"></span> Safe to close this window</div>
  </main>
</body>
</html>
