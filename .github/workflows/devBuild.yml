name: Release Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
      prerelease:
        description: 'Mark as pre-release?'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version
        id: version
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const parts = conf.version.split('.').map(Number);
            const bump = '${{ github.event.inputs.bump }}';
            
            if (bump === 'minor') {
              parts[1]++;
              parts[2] = 0;
            } else {
              parts[2]++;
            }
            
            // Never hit 1.0
            if (parts[0] >= 1) {
              console.error('ERROR: Version would reach 1.0. Use 1.0 only for official release.');
              process.exit(1);
            }
            
            const newVersion = parts.join('.');
            conf.version = newVersion;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
            
            // Also update package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = newVersion;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            
            console.log('New version: ' + newVersion);
          "
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src-tauri/tauri.conf.json package.json
          git commit -m "bump version to v${{ steps.version.outputs.version }}"
          git push

      - name: Setup Rust targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-gnu

      - name: Generate latest.json
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/x86_64-pc-windows-gnu/release/bundle"
          
          NSIS_ZIP=$(find "$BUNDLE_DIR/nsis" -name "*.nsis.zip" | head -1)
          NSIS_SIG=$(find "$BUNDLE_DIR/nsis" -name "*.nsis.zip.sig" | head -1)
          
          if [ -z "$NSIS_ZIP" ] || [ -z "$NSIS_SIG" ]; then
            echo "ERROR: Could not find NSIS bundle or signature"
            find "$BUNDLE_DIR" -type f | sort
            exit 1
          fi
          
          NSIS_FILENAME=$(basename "$NSIS_ZIP")
          SIGNATURE=$(cat "$NSIS_SIG")
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Cryptext v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/abhichenna00/Cryptext_Client/releases/download/${TAG}/${NSIS_FILENAME}"
              }
            }
          }
          EOF
          
          echo "Generated latest.json:"
          cat latest.json

      - name: List build artifacts
        run: |
          find src-tauri/target/x86_64-pc-windows-gnu/release/bundle -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Cryptext v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.nsis.zip
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.sig
            latest.json
          body: |
            ## Cryptext v${{ steps.version.outputs.version }}
            
            **Commit:** ${{ github.sha }}