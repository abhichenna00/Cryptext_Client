name: Development Build

on:
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Windows)
        run: pnpm tauri build --target x86_64-pc-windows-gnu

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/**/*.exe
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/**/*.sig
          retention-days: 7

  create-dev-release:
    needs: [build-windows]
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-dev.${{ github.run_number }}
          name: Dev Build v${{ steps.version.outputs.version }}-dev.${{ github.run_number }}
          prerelease: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.sig
          body: |
            ## Development Build
            
            **Version:** ${{ steps.version.outputs.version }}-dev.${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            
            ⚠️ Development build for testing purposes.