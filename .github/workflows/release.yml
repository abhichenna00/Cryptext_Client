name: Release Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark as pre-release?'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Calculate version from latest tag
        id: version
        run: |
          export PATH="/usr/bin:$PATH"

          # Get latest version tag, default to 0.0.0 if none exist
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_VERSION="0.0.0"
          else
            LATEST_VERSION="${LATEST_TAG#v}"
          fi

          echo "Latest version: $LATEST_VERSION"

          # Bump version
          node -e "
            const parts = '${LATEST_VERSION}'.split('.').map(Number);
            const bump = '${{ github.event.inputs.bump }}';

            if (bump === 'major') {
              parts[0]++;
              parts[1] = 0;
              parts[2] = 0;
            } else if (bump === 'minor') {
              parts[1]++;
              parts[2] = 0;
            } else {
              parts[2]++;
            }

            console.log(parts.join('.'));
          "

          VERSION=$(node -p "
            const parts = '${LATEST_VERSION}'.split('.').map(Number);
            const bump = '${{ github.event.inputs.bump }}';
            if (bump === 'major') { parts[0]++; parts[1] = 0; parts[2] = 0; }
            else if (bump === 'minor') { parts[1]++; parts[2] = 0; }
            else { parts[2]++; }
            parts.join('.');
          ")

          echo "New version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Inject version into project files
        run: |
          export PATH="/usr/bin:$PATH"
          VERSION="${{ steps.version.outputs.version }}"

          node -e "
            const fs = require('fs');

            const conf = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '${VERSION}';
            fs.writeFileSync('apps/desktop/src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));

            const pkg = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('apps/desktop/package.json', JSON.stringify(pkg, null, 2));

            console.log('Injected version: ${VERSION}');
          "

      - name: Extract changelog for current version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          CHANGELOG=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;p;}" CHANGELOG.md | sed '/^$/N;/^\n$/d')
          # Write to output using delimiter for multiline
          echo "changelog<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

      - name: Load Rust environment
        run: |
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Rust targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      - name: Clean old bundles
        run: rm -rf apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*

      - name: Build Tauri app
        run: pnpm tauri build --target x86_64-pc-windows-gnu
        working-directory: apps/desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/
          retention-days: 1

  sign-and-release:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Clean old release artifacts
        run: rm -rf bundle/nsis/*

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-build
          path: bundle/nsis

      - name: Decode certificate
        run: echo "${{ secrets.WINDOWS_CERTIFICATE }}" | base64 -d > /tmp/CryptextDevelopmentCert.pfx

      - name: Code sign installer with osslsigncode
        run: |
          SETUP_EXE=$(find "bundle/nsis" -name "*-setup.exe" | head -1)

          if [ -z "$SETUP_EXE" ]; then
            echo "ERROR: Could not find installer"
            find "bundle/nsis" -type f | sort
            exit 1
          fi

          echo "Code signing: $SETUP_EXE"
          osslsigncode sign \
            -pkcs12 /tmp/CryptextDevelopmentCert.pfx \
            -pass "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" \
            -n "Cryptext" \
            -i "https://cryptext.duckdns.org" \
            -t "http://timestamp.digicert.com" \
            -in "$SETUP_EXE" \
            -out "${SETUP_EXE%.exe}-signed.exe"

          # Replace original with signed binary
          mv "${SETUP_EXE%.exe}-signed.exe" "$SETUP_EXE"

      - name: Clean up certificate
        if: always()
        run: rm -f /tmp/CryptextDevelopmentCert.pfx

      - name: Sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          SETUP_EXE=$(find "bundle/nsis" -name "*-setup.exe" | head -1)

          if [ -z "$SETUP_EXE" ]; then
            echo "ERROR: Could not find installer"
            find "bundle/nsis" -type f | sort
            exit 1
          fi

          echo "Signing: $SETUP_EXE"
          npx @tauri-apps/cli signer sign "$SETUP_EXE" --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Generate latest.json
        run: |
          SETUP_EXE=$(find "bundle/nsis" -name "*-setup.exe" | head -1)
          SETUP_SIG=$(find "bundle/nsis" -name "*-setup.exe.sig" | head -1)

          if [ -z "$SETUP_EXE" ] || [ -z "$SETUP_SIG" ]; then
            echo "ERROR: Could not find installer or signature"
            find "bundle/nsis" -type f | sort
            exit 1
          fi

          FILENAME=$(basename "$SETUP_EXE")
          SIGNATURE=$(cat "$SETUP_SIG")
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v${VERSION}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Cryptext v${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/abhichenna00/Cryptext_Client/releases/download/${TAG}/${FILENAME}"
              }
            }
          }
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Cryptext v${{ needs.build.outputs.version }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            bundle/nsis/*-setup.exe
            bundle/nsis/*.sig
            latest.json
          body: |
            ## Cryptext v${{ needs.build.outputs.version }}

            ${{ needs.build.outputs.changelog }}

            **Commit:** ${{ github.sha }}